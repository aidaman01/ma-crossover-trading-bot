# Type checking (mypy). CI runs: mypy
# Scope: the pure, typed modules (metrics, regimes, data layer). allocation.py (live path)
# joins once its one missing annotation is added after the live run of 2026-10-05.
[mypy]
python_version = 3.12
files = metrics.py, regimes.py, research_data.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True

# TEMPORARY: allocation.py is on the live execution path and frozen until the live run of
# 2026-10-05 finishes; its single missing annotation is fixed afterwards and this is removed.
[mypy-allocation]
ignore_errors = True
