# Type checking (mypy). CI runs: mypy
# Scope: the pure, typed modules (metrics, regimes, data layer, shared trading rules).
[mypy]
python_version = 3.12
files = metrics.py, regimes.py, research_data.py, allocation.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
